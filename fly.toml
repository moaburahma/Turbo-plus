app = "turbo-plus"

primary_region = "ams"

[build]

[env]
  PORT = "5000"
  DB_PATH = "/data/database.db"

[processes]
  app = "gunicorn --bind 0.0.0.0:5000 dashboard:app"
  worker = "python telegram_bot.py"

[[mounts]]
  source = "turbo_plus_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]