# fly.toml app configuration file generated for turbo-plus on 2026-08-03T16:16:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'turbo-plus'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/database.db'
  PORT = '5000'

[processes]
  app = 'gunicorn --bind 0.0.0.0:5000 dashboard:app'
  worker = 'python telegram_bot.py'

[[mounts]]
  source = 'turbo_plus_data'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['worker']
