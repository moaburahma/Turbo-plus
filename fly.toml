app = "turbo-plus"
primary_region = "fra"

[build]

[processes]
  whatsapp = "gunicorn -w 1 -b 0.0.0.0:8080 app:app"
  dashboard = "gunicorn -w 1 -b 0.0.0.0:8081 dashboard:app"
  telegrambot = "python telegram_bot.py"

[[services]]
  processes = ["whatsapp"]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

[[services]]
  processes = ["dashboard"]
  internal_port = 8081
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8081
    handlers = ["tls", "http"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1