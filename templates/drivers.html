{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">المناديب</h3>
<form method="POST" action="{{ url_for('add_driver') }}" class="d-flex gap-2 mb-4">
    <input class="form-control" name="name" placeholder="اسم المندوب" required>
    <input class="form-control" name="phone" placeholder="رقم الهاتف (201xxxxxxxxx)" required>
    <input class="form-control" name="password" placeholder="كلمة مرور مبدئية" required>
    <button class="btn btn-dark">إضافة مندوب</button>
</form>
<table class="table bg-white">
    <thead><tr><th>الاسم</th><th>الرقم</th><th>الرصيد</th><th>عدد الطلبات الشهري</th><th>الحالة</th><th>إجراءات</th></tr></thead>
    <tbody>
    {% for d in drivers %}
        <tr>
            <td>{{ d.name }}</td><td>{{ d.phone }}</td><td>{{ d.balance }}</td>
            <td>{{ d.monthly_orders_count }}</td><td>{{ "محظور" if d.is_blocked else "نشط" }}</td>
            <td class="d-flex gap-1">
                <form method="POST" action="{{ url_for('update_driver', driver_id=d.id) }}" class="d-flex gap-1">
                    <input type="hidden" name="action" value="add_balance">
                    <input type="number" name="amount" class="form-control form-control-sm" style="width:80px" placeholder="مبلغ">
                    <button class="btn btn-sm btn-success">شحن</button>
                </form>
                <form method="POST" action="{{ url_for('update_driver', driver_id=d.id) }}">
                    <input type="hidden" name="action" value="{{ 'unblock' if d.is_blocked else 'block' }}">
                    <button class="btn btn-sm {{ 'btn-secondary' if d.is_blocked else 'btn-danger' }}">
                        {{ "فك الحظر" if d.is_blocked else "حظر" }}
                    </button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
