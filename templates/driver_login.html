<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول المندوب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body style="background:#1e2430; height:100vh; display:flex; align-items:center; justify-content:center;">
<div class="card p-4" style="width: 350px;">
    <h4 class="text-center mb-4">تسجيل دخول المندوب</h4>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert alert-danger">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST">
        <input class="form-control mb-3" name="phone" placeholder="رقم الهاتف" required>
        <input class="form-control mb-3" type="password" name="password" placeholder="كلمة المرور" required>
        <button class="btn btn-dark w-100">دخول</button>
    </form>
</div>
</body>
</html>
