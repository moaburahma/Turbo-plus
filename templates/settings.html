{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">الإعدادات</h3>
<form method="POST" style="max-width:400px;">
    <label class="form-label">نسبة العمولة (%)</label>
    <input class="form-control mb-3" name="commission_percent" value="{{ commission }}">
    <label class="form-label">قيمة النقطة لكل طلب</label>
    <input class="form-control mb-3" name="points_per_order" value="{{ points }}">

    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="individual_enabled" id="ie"
               {% if individual_enabled == '1' %}checked{% endif %}>
        <label class="form-check-label" for="ie">تفعيل خيار "توصيل أفراد" للعملاء</label>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="packages_enabled" id="pe"
               {% if packages_enabled == '1' %}checked{% endif %}>
        <label class="form-check-label" for="pe">تفعيل خيار "طلبات" للعملاء</label>
    </div>
    <div class="alert alert-info py-2" style="font-size: 0.9rem;">
        لو الاتنين مفعّلين، العميل هيختار بينهم. لو واحد بس مفعّل، هيدخل عليه مباشرة من غير ما يختار. لو الاتنين متعطّلين، الخدمة هتبقى غير متاحة مؤقتًا.
    </div>

    <button class="btn btn-dark">حفظ</button>
</form>

<hr class="my-4">
<h5>تغيير بيانات دخول الأدمن</h5>
<form method="POST" style="max-width:400px;">
    <label class="form-label">اسم المستخدم الجديد</label>
    <input class="form-control mb-3" name="new_username" required>
    <label class="form-label">كلمة المرور الجديدة</label>
    <input class="form-control mb-3" type="password" name="new_password" required>
    <label class="form-label">كلمة المرور الحالية (للتأكيد)</label>
    <input class="form-control mb-3" type="password" name="current_password" required>
    <button class="btn btn-outline-dark">تحديث بيانات الدخول</button>
</form>
{% endblock %}
